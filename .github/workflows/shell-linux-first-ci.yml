name: Gentle Shell first Linux evidence

on:
  push:
    branches: [feat/shell-linux-runtime-35]

permissions: {}

jobs:
  focused-linux:
    if: github.repository == 'decode2/gentle-ai' && github.ref == 'refs/heads/feat/shell-linux-runtime-35'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      # No checkout action or credentialed checkout: the exact public commit is data.
      - name: Fetch exact public fork commit without a token
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REPO: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_ASKPASS: /bin/false
        run: |
          set -euo pipefail
          test "$EXPECTED_REPO" = 'decode2/gentle-ai'
          test "$EXPECTED_REF" = 'refs/heads/feat/shell-linux-runtime-35'
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test ! -e .git
          git init -q
          git remote add origin https://github.com/decode2/gentle-ai.git
          git -c credential.helper= -c core.askPass= -c http.followRedirects=false \
            fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'Verified public fork commit: %s\n' "$EXPECTED_SHA"

      # Stock OS boundary first: no candidate Go/Node/Pi enters this image.
      - name: Build pinned stock Linux guest
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          command -v timeout
          test -r /proc/self/ns/net && test -r /proc/self/ns/mnt
          timeout --kill-after=5 180 docker build -f e2e/Dockerfile.shell-linux-guest -t gentle-shell-guest:ci e2e

      - name: Prove stock guest isolation and rejection controls
        shell: bash
        run: |
          set -euo pipefail
          host_net="$(stat -Lc %i /proc/self/ns/net)"
          host_mnt="$(stat -Lc %i /proc/self/ns/mnt)"
          guest() {
            local network="$1"
            shift
            timeout --kill-after=5 30 docker run --rm --pull=never \
              --network "$network" --cap-drop=ALL \
              --security-opt=no-new-privileges --read-only --user 65532:65532 \
              --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
              --cpus=1 --memory=128m --memory-swap=128m --pids-limit=32 \
              -e HOME=/tmp -e HOST_NETNS="$host_net" -e HOST_MNTNS="$host_mnt" \
              "$@" gentle-shell-guest:ci
          }
          # Success is required before testing controls; Docker failure is not proof.
          guest none
          expect_rejection() {
            local expected="$1" status=0 output
            shift
            # Capture privately: raw guest output could contain environment values.
            output="$(guest "$@" 2>&1)" || status=$?
            if test "$status" != 1 || test "$output" != "$expected"; then
              printf 'STOP: negative control did not return the expected guest rejection (status=%s).\n' "$status" >&2
              exit 1
            fi
          }
          expect_rejection 'STOP: non-loopback interface present' bridge
          expect_rejection 'STOP: unexpected environment name (credentials forbidden)' none -e GITHUB_TOKEN=synthetic-canary
          printf 'Stock guest positive and negative controls passed; installation remains unproven.\n'

      # Fetch archive bytes as DATA only. Never unpack or execute npm lifecycle scripts.
      - name: Measure human-approved Stable archive bytes without execution
        shell: bash
        env:
          ARCHIVE_URL: https://registry.npmjs.org/gentle-pi/-/gentle-pi-3.7.0.tgz
          EXPECTED_SRI: sha512-SXBp9jIRnVIcOsLCW/Zw4XDTXxhViXNxrCZS7LyioB6kdRl99Ohojeaj+yIH5+K/ucwLlTlHYBz8zwue9aspNQ==
        run: |
          set -euo pipefail
          umask 077
          archive="$(mktemp "$RUNNER_TEMP/gentle-shell-stable-3.7.0.XXXXXXXX.tgz")"
          trap 'rm -f -- "$archive"' EXIT
          status="$(curl --proto '=https' --max-redirs 0 --fail --silent --show-error \
            --tlsv1.2 --connect-timeout 10 --max-time 90 --max-filesize 67108864 \
            --write-out '%{http_code}' --output "$archive" "$ARCHIVE_URL")"
          test "$status" = 200
          bytes="$(wc -c < "$archive" | tr -d '[:space:]')"
          test "$bytes" -gt 0 && test "$bytes" -le 67108864
          actual_sri="sha512-$(openssl dgst -sha512 -binary "$archive" | base64 -w0)"
          test "$actual_sri" = "$EXPECTED_SRI"
          sha256="$(sha256sum "$archive" | cut -d ' ' -f1)"
          printf 'Stable data only: gentle-pi@3.7.0 bytes=%s sha256=%s sri=%s\n' \
            "$bytes" "$sha256" "$actual_sri"

          # Reuse these exact fetched bytes; no second fetch, npm or install route.
          # Minimal context contains only named harness files and the data archive.
          context="$(mktemp -d "$RUNNER_TEMP/shell-source-data.XXXXXXXX")"
          cp e2e/Dockerfile.shell-linux-source-data e2e/shell-linux-guest-proof.sh \
            e2e/shell-linux-source-data-guest.sh e2e/shell-linux-source-data-controls.sh "$context/"
          cp "$archive" "$context/approved.tgz"
          timeout --kill-after=5 180 docker build \
            -f "$context/Dockerfile.shell-linux-source-data" -t gentle-shell-source-data:ci "$context"
          host_net="$(stat -Lc %i /proc/self/ns/net)"
          host_mnt="$(stat -Lc %i /proc/self/ns/mnt)"
          # Stock proof runs again in this exact guest before synthetic or real data.
          timeout --kill-after=5 150 docker run --rm --pull=never \
            --network none --read-only --user 65532:65532 --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777,size=96m \
            --cpus=1 --memory=128m --memory-swap=128m --pids-limit=32 \
            -e HOME=/tmp -e HOST_NETNS="$host_net" -e HOST_MNTNS="$host_mnt" \
            gentle-shell-source-data:ci

      # Component install evidence: no operator runtime or broad checkout context.
      - name: Acquire pinned runtime data and execute private install in isolated guest
        timeout-minutes: 16
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          context="$(mktemp -d "$RUNNER_TEMP/shell-private-runtime.XXXXXXXX")"
          status="$(curl --proto '=https' --max-redirs 0 --fail --silent --show-error \
            --tlsv1.2 --connect-timeout 10 --max-time 120 --max-filesize 57224421 \
            --write-out '%{http_code}' --output "$context/node.tgz" \
            https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-x64.tar.gz)"
          test "$status" = 200
          test "$(wc -c < "$context/node.tgz")" = 57224421
          echo "783130984963db7ba9cbd01089eaf2c2efb055c7c1693c943174b967b3050cb8  $context/node.tgz" | sha256sum -c -
          cp e2e/Dockerfile.shell-linux-private-runtime e2e/shell-linux-guest-proof.sh \
            e2e/shell-linux-private-runtime-guest.sh scripts/install-gentle-shell-private.sh \
            scripts/complete-generated-lock-sri.mjs e2e/complete-generated-lock-sri.test.mjs \
            scripts/normalize-private-optional-platform-closure.mjs \
            e2e/normalize-private-optional-platform-closure.test.mjs "$context/"
          printf 'Owned data-only commands source=%s\n' "$GITHUB_SHA"
          sha256sum "$context/complete-generated-lock-sri.mjs" "$context/complete-generated-lock-sri.test.mjs" \
            "$context/normalize-private-optional-platform-closure.mjs" \
            "$context/normalize-private-optional-platform-closure.test.mjs"
          printf '%s\n' \
            '/bundle/node/bin/node --max-old-space-size=256 /owned/complete-generated-lock-sri.test.mjs' \
            '/bundle/node/bin/node --max-old-space-size=256 /owned/complete-generated-lock-sri.mjs /bundle/project/package-lock.json' \
            '/bundle/node/bin/node --max-old-space-size=256 /owned/normalize-private-optional-platform-closure.test.mjs' \
            'normalizer="$(dirname "$0")/normalize-private-optional-platform-closure.mjs"' \
            'env -i "$node" --input-type=module - "$stage/project" "$normalizer"'
          # Capture complete output in memory; reject excess before public printing.
          bounded() {
            local output status=0 bytes
            output="$("$@" 2>&1)" || status=$?
            bytes="$(printf '%s' "$output" | wc -c)"
            test "$bytes" -le 12000 || { printf 'STOP: component output bound exceeded.\n'; return 1; }
            printf '%s\n' "$output"
            return "$status"
          }
          printf 'Private install candidate source=%s Node-data-sha256=783130984963db7ba9cbd01089eaf2c2efb055c7c1693c943174b967b3050cb8\n' "$GITHUB_SHA"
          bounded timeout --kill-after=5 480 env DOCKER_BUILDKIT=0 docker build --quiet --network=default \
            --memory=3g --memory-swap=3g --cpu-period=100000 --cpu-quota=100000 \
            --build-arg SOURCE_SHA="$GITHUB_SHA" \
            -f "$context/Dockerfile.shell-linux-private-runtime" \
            -t gentle-shell-private-runtime:ci "$context"
          host_net="$(stat -Lc %i /proc/self/ns/net)"
          host_mnt="$(stat -Lc %i /proc/self/ns/mnt)"
          bounded timeout --kill-after=5 300 docker run --rm --pull=never \
            --network none --read-only --user 65532:65532 --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,exec,mode=1777,size=2g \
            --cpus=1 --memory=3g --memory-swap=3g --pids-limit=64 \
            -e HOME=/tmp -e HOST_NETNS="$host_net" -e HOST_MNTNS="$host_mnt" \
            gentle-shell-private-runtime:ci

      - name: Select pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
          token: ''

      # Prefetch module before tests; no OS network isolation is claimed.
      - name: Prepare the one focused external module
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOMODCACHE: ${{ runner.temp }}/shell-ci/modcache
        run: |
          set -euo pipefail
          test "$(go version)" = 'go version go1.25.10 linux/amd64'
          mkdir -p "$GOMODCACHE"
          go mod download golang.org/x/sys@v0.47.0

      - name: Build authentication tests offline and execute only in broker guest
        shell: bash
        env:
          GOMODCACHE: ${{ runner.temp }}/shell-ci/modcache
        run: |
          set -euo pipefail
          test "$(go version)" = 'go version go1.25.10 linux/amd64'
          scratch="$RUNNER_TEMP/shell-broker-context"
          mkdir -p "$scratch" "$RUNNER_TEMP/shell-ci/home" \
            "$RUNNER_TEMP/shell-ci/tmp" "$RUNNER_TEMP/shell-ci/gocache"
          format_diff="$RUNNER_TEMP/shell-ci/broker-gofmt.diff"
          timeout 10 env -i PATH="$PATH" HOME="$RUNNER_TEMP/shell-ci/home" \
            TMPDIR="$RUNNER_TEMP/shell-ci/tmp" gofmt -d \
            internal/shellinstaller/linux_broker_peer_linux.go \
            internal/shellinstaller/linux_broker_peer_linux_test.go \
            internal/shellinstaller/linux_broker_consent_linux.go \
            internal/shellinstaller/linux_broker_consent_linux_test.go \
            | head -c 65536 | tee "$format_diff"
          test ! -s "$format_diff"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/shell-ci/home" \
            TMPDIR="$RUNNER_TEMP/shell-ci/tmp" GOCACHE="$RUNNER_TEMP/shell-ci/gocache" \
            GOMODCACHE="$GOMODCACHE" GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off CGO_ENABLED=0 \
            go test -mod=readonly -c -o "$scratch/shellinstaller.test" ./internal/shellinstaller
          cp e2e/Dockerfile.shell-linux-broker e2e/shell-linux-broker-guest.sh \
            e2e/shell-linux-guest-proof.sh "$scratch/"
          timeout --kill-after=5 180 docker build -f "$scratch/Dockerfile.shell-linux-broker" \
            -t gentle-shell-broker:ci "$scratch"
          host_net="$(stat -Lc %i /proc/self/ns/net)"
          host_mnt="$(stat -Lc %i /proc/self/ns/mnt)"
          timeout --kill-after=5 40 docker run --rm --pull=never \
            --network none --read-only --user 0:0 --cap-drop=ALL \
            --cap-add=SETUID --cap-add=SETGID --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            --cpus=1 --memory=128m --memory-swap=128m --pids-limit=32 \
            -e HOME=/tmp -e HOST_NETNS="$host_net" -e HOST_MNTNS="$host_mnt" \
            gentle-shell-broker:ci

      - name: Run focused tests with a scrubbed process environment
        shell: bash
        env:
          GOMODCACHE: ${{ runner.temp }}/shell-ci/modcache
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/shell-ci/home" \
            "$RUNNER_TEMP/shell-ci/tmp" "$RUNNER_TEMP/shell-ci/gocache"
          printf 'Testing exact commit: %s\n' "$GITHUB_SHA"
          env -i PATH="$PATH" \
            HOME="$RUNNER_TEMP/shell-ci/home" TMPDIR="$RUNNER_TEMP/shell-ci/tmp" \
            GOCACHE="$RUNNER_TEMP/shell-ci/gocache" GOMODCACHE="$GOMODCACHE" \
            GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off \
            go test -mod=readonly -count=1 -p 2 -parallel 2 -timeout=2m \
              ./internal/shellinstaller ./internal/pathidentity

      - name: Check formatting of Shell Linux source and synthetic tests
        shell: bash
        run: |
          set -euo pipefail
          diff="$RUNNER_TEMP/shell-ci/gofmt.diff"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/shell-ci/home" \
            TMPDIR="$RUNNER_TEMP/shell-ci/tmp" \
            gofmt -d internal/shellinstaller/linux_instance_inventory_linux.go \
              internal/shellinstaller/linux_instance_inventory_linux_test.go \
              internal/shellinstaller/linux_transaction_test.go \
              internal/shellinstaller/gentle_shell_source_test.go \
              internal/shellinstaller/gentle_shell_tls.go \
              internal/shellinstaller/gentle_shell_tls_test.go \
              internal/shellinstaller/linux_journal_root_linux.go \
              internal/shellinstaller/linux_journal_root_linux_test.go \
              internal/shellinstaller/linux_journal_prepare_linux.go \
              internal/shellinstaller/linux_journal_prepare_linux_test.go | tee "$diff"
          if test -s "$diff"; then
            printf 'STOP: synthetic tests are not gofmt-clean; full diff above.\n' >&2
            exit 1
          fi
